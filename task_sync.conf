# Configuration for task_sync.sh.
#
# Keep values shell-compatible: KEY=value, no spaces around "=".

# Commands.
TASK_BIN=task
PYTHON_BIN=python3

# Nautical core location. This shared default can point either to:
#   - the directory that contains nautical_core/
#   - the nautical_core/ directory itself
# Default from task_sync.sh is the parent of this sync/ directory.
NAUTICAL_CORE_PATH=~/.task
#
# If this sync/ folder is shared across devices with different paths, keep the
# shared default above and list only exceptions below. Matching uses hostname by
# default, with user@hostname as a fallback.
#
# If multiple devices have generic hostnames, map them to stable keys first:
# DEVICE_CONFIG_KEYS='
# dreno-excalibur=desktop
# u0_a885@localhost=phone
# '
#
# DEVICE_NAUTICAL_CORE_PATHS='
# desktop=/home/user/.task
# phone=/storage/emulated/0/.task
# user@legacy-host=/mnt/shared/taskwarrior
# '
#
# The repair tools are expected in nautical_core/tools/.
# Override this only if your tools live elsewhere.
# NAUTICAL_TOOLS_DIR=/path/to/tools
#
# Optional per-device path overrides for non-default layouts.
# DEVICE_NAUTICAL_TOOLS_DIRS='
# phone=/storage/emulated/0/.task/nautical_core/tools
# '

# Device label used for per-device logs. Default is user@hostname.
# LOG_DEVICE_ID=desktop

# Runtime locations. Locks default to XDG_RUNTIME_DIR (or TMPDIR, then /tmp)
# so a file-sharing service never treats a lock as cross-device state.
# LOG_DIR is intentionally kept next to the script by default.
# LOCK_DIR=/tmp/task_sync.lock
# DEVICE_LOG_DIRS='
# phone=/storage/emulated/0/task-sync-logs
# '
# DEVICE_LOCK_DIRS='
# phone=/data/data/com.termux/files/usr/tmp/task_sync.lock
# '
MAX_LOG_SIZE=102400

# Nautical recovery is opt-in and dry-run by default.
# Chain repair only reconnects existing prevLink/nextLink pointers.
RUN_NAUTICAL_CHAIN_REPAIR=0
NAUTICAL_CHAIN_REPAIR_APPLY=0

# Reconcile may create missing next tasks after hookless completions.
RUN_NAUTICAL_RECONCILE=0
NAUTICAL_RECONCILE_APPLY=0

# Also run Nautical recovery when the script decides no sync is needed.
RUN_NAUTICAL_ON_NO_SYNC=0
